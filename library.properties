sentence=Driver for the Analog Devices MAX30001 ECG and bio-impedance (respiration) AFE on the ProtoCentral MAX30001 Breakout.
paragraph=Reads single-lead ECG at 128/256/512 SPS and bio-impedance (BioZ) respiration at 64 SPS over SPI, with the chip's hardware R-to-R heart-rate detector, per-electrode DC lead-off detection, FIFO interrupts on INTB, and configurable gain and filters. Includes a ProtoCentral OpenView streaming example. Every example fits on an Arduino Uno. For research and education only - not a medical device.
